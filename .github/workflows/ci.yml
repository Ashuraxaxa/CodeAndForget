name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (build + pruebas unitarias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/Mantenedores.sln -warnaserror
      - run: dotnet test backend/tests/Mantenedores.Tests --no-build

  # Batería común por motor (D-033) contra la versión mínima soportada (D-035) y la actual.
  # SQL Server 2016 no tiene imagen Linux: la más antigua en contenedor es 2017.
  integration:
    name: Integración · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: versiones mínimas (PG 12 · SQL Server 2017 · MySQL 8.0 · MariaDB 10.6)
            pg: postgres:12
            postgis: postgis/postgis:12-3.4
            mssql: mcr.microsoft.com/mssql/server:2017-latest
            mysql: mysql:8.0
            mariadb: mariadb:10.6
            redis: redis:6.2
          - name: versiones actuales (PG 16 · SQL Server 2022 · MySQL 8.4 · MariaDB 11.4)
            pg: postgres:16
            postgis: postgis/postgis:16-3.4
            mssql: mcr.microsoft.com/mssql/server:2022-latest
            mysql: mysql:8.4
            mariadb: mariadb:11.4
            redis: redis:7.4
    env:
      MANTENEDORES_PG_IMAGE: ${{ matrix.pg }}
      MANTENEDORES_POSTGIS_IMAGE: ${{ matrix.postgis }}
      MANTENEDORES_MSSQL_IMAGE: ${{ matrix.mssql }}
      MANTENEDORES_MYSQL_IMAGE: ${{ matrix.mysql }}
      MANTENEDORES_MARIADB_IMAGE: ${{ matrix.mariadb }}
      MANTENEDORES_REDIS_IMAGE: ${{ matrix.redis }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/tests/Mantenedores.IntegrationTests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Valida que la imagen única (API + frontend) compile (P-001).
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t celdo:ci .
      - name: La imagen arranca y responde
        run: |
          docker run -d --name app -p 8080:8080 \
            -e Auth__JwtKey=ci-solo-pruebas-0123456789abcdefghijklmn \
            celdo:ci
          # ready: además verifica la metadata (SQLite) dentro del contenedor
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health/ready && exit 0; sleep 2; done
          docker logs app; exit 1
