# Publica el landing de Celdo (landing/) en el App Service "celdo" de Azure (P-118).
# Solo archivos estáticos: no compila .NET ni el frontend de la app. Corre cuando cambia el landing
# o este archivo en main, o a mano desde Actions.
# Docs: https://github.com/Azure/webapps-deploy

name: Landing de Celdo en Azure

on:
  push:
    branches:
      - 'main'
    paths:
      - 'landing/**'
      - '.github/workflows/main_celdo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Lo que se publica: la página, sus imágenes y web.config (IIS). El README queda fuera.
      - name: Preparar el landing
        run: |
          mkdir -p site
          cp landing/index.html landing/web.config site/
          cp -r landing/img site/img
          test -f site/index.html && test -f site/img/celdo-simbolo.svg
          ls -R site

      - name: Subir el sitio para publicarlo
        uses: actions/upload-artifact@v4
        with:
          name: landing
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Sin "environment": la credencial federada de Azure se creó para la rama main, y declarar un
    # environment cambiaría la identidad con que GitHub se presenta, y el login fallaría.
    permissions:
      id-token: write # para iniciar sesión en Azure con OIDC
      contents: read

    steps:
      - name: Bajar el sitio
        uses: actions/download-artifact@v4
        with:
          name: landing
          path: site

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0931E60257C54DC2A83B5E746B29BDAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AE999EC06814467781B85362C2924599 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7133B19712134C09986F9A23180A2CD5 }}

      - name: Publicar en el App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'celdo'
          slot-name: 'Production'
          package: site
