name: Publicar versión

# Al etiquetar una versión (git tag v1.2.0 && git push origin v1.2.0) publica la imagen Docker oficial (P-123, D-109):
# siempre en GitHub Container Registry y, si está configurado, también en Docker Hub.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta ya publicada que se quiere volver a construir (p. ej. v1.2.0)
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build backend/Mantenedores.sln -warnaserror
      - run: dotnet test backend/tests/Mantenedores.Tests --no-build
      - run: npm ci && npm run lint
        working-directory: frontend

  image:
    name: Imagen Docker
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub es opcional: variable DOCKERHUB_IMAGE (p. ej. celdo/celdo) y secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN.
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versión y nombre de la imagen
        id: v
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/celdo" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1.2.0 → 1.2.0, 1.2 y latest. Una versión previa (1.2.0-rc.1) solo lleva su propia etiqueta.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ steps.v.outputs.ghcr }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo '```'
            echo "docker run -d -p 8080:8080 -v celdo-data:/app/data ${{ steps.v.outputs.ghcr }}:${{ steps.v.outputs.version }}"
            echo '```'
            echo
            echo "Etiquetas:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
