<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La API reemplaza esta base por la subruta real (Hosting:PathBase). No cambiar el texto. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celdo</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Tema guardado (Auto / Día / Noche) antes de dibujar, para que no parpadee. Igual que src/theme/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('mantenedores.theme') } catch (e) {}
        // Embebida (?tema=claro|oscuro|sistema): manda el tema que pide la app anfitriona. Igual que src/lib/embed.ts.
        if (/\/embed(\/|$)/.test(location.pathname)) {
          var q = (new URLSearchParams(location.search).get('tema') || '').toLowerCase()
          if (q) t = { claro: 'light', light: 'light', oscuro: 'dark', dark: 'dark' }[q] || null
        }
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
